<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09111f">
    <meta name="color-scheme" content="dark">
    <title>{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/og-portfolio.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta name="twitter:image" content="{{ '/assets/images/og-portfolio.png' | absolute_url }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Xingye Zhang",
        "alternateName": "Austin Zhang",
        "url": "https://www.xingyezhang.com",
        "sameAs": [
          "https://github.com/az-serein",
          "https://www.linkedin.com/in/az-serein"
        ],
        "alumniOf": [
          {"@type": "CollegeOrUniversity", "name": "University of Connecticut"}
        ],
        "affiliation": {"@type": "CollegeOrUniversity", "name": "University of Pennsylvania"},
        "knowsAbout": ["AI agents", "LLM evaluation", "data science", "geospatial analysis"]
      }
    </script>
  </head>
  <body class="{{ page.body_class | default: 'page' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header" data-site-header>
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Xingye Zhang home">
          <span class="brand-mark" aria-hidden="true">XZ</span>
          <span class="brand-name">Xingye Zhang</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/work/' | relative_url }}"{% if page.nav == 'work' %} aria-current="page"{% endif %}>Work</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/resume/' | relative_url }}"{% if page.nav == 'resume' %} aria-current="page"{% endif %}>Résumé</a>
          <a class="nav-contact" href="mailto:azserein1016@outlook.com">Contact</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-grid">
        <div>
          <p class="footer-kicker">Let’s build something reliable.</p>
          <a class="footer-email" href="mailto:azserein1016@outlook.com">azserein1016@outlook.com</a>
        </div>
        <div class="footer-links" aria-label="External links">
          <a href="https://github.com/az-serein" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
          <a href="https://www.linkedin.com/in/az-serein" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
          <a href="{{ '/molly/' | relative_url }}">Molly</a>
        </div>
      </div>
      <div class="shell footer-bottom">
        <span>© {{ 'now' | date: '%Y' }} Xingye Zhang</span>
        <span>Designed for clarity, evidence, and useful work.</span>
      </div>
    </footer>
  </body>
</html>
