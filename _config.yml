locale: "en-US"
title: "Xingye Zhang"
name: "Xingye Zhang"
description: "Systems Engineering M.S. student building reliable AI agents, reproducible evaluations, and practical data systems."
url: "https://www.xingyezhang.com"
baseurl: ""
repository: "az-serein/az-serein.github.io"
timezone: "America/New_York"

author:
  name: "Xingye Zhang"
  bio: "AI Agent Systems · Applied Data Science"
  location: "Philadelphia, Pennsylvania"
  email: "azserein1016@outlook.com"
  github: "az-serein"
  linkedin: "az-serein"

markdown: kramdown
highlighter: rouge
future: false
permalink: /:categories/:title/
theme: null

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

include:
  - _pages

exclude:
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - CONTENT_LICENSE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - THIRD_PARTY_NOTICES.md
  - node_modules
  - resume
  - vendor
  - local
  - tmp

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: portfolio
  - scope:
      path: "files"
    values:
      sitemap: false
  - scope:
      path: "_pages/New_Haven_Interactive_Map_Sample.html"
    values:
      sitemap: false

redirect_from:
  json: false
