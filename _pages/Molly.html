---
layout: portfolio
title: "Molly"
permalink: /molly/
description: "A small personal gallery for Molly."
body_class: molly-page
---

<header class="page-hero">
  <div class="shell">
    <p class="eyebrow">A personal corner</p>
    <h1>Meet Molly.</h1>
    <p class="page-intro">Part research companion, part reminder to step away from the screen.</p>
  </div>
</header>

<section class="section compact" aria-label="Molly photo gallery">
  <div class="shell molly-gallery" data-molly-gallery>
    <div class="molly-stack__stage">
      <figure class="molly-card" data-molly-card><img src="{{ '/assets/images/molly-1.jpg' | relative_url }}" alt="Molly holding a striped sock beside a sunny window" width="1200" height="1600"></figure>
      <figure class="molly-card" data-molly-card><img src="{{ '/assets/images/molly-2.jpg' | relative_url }}" alt="Molly tucked into a soft blanket on the couch" loading="lazy" width="1200" height="1600"></figure>
      <figure class="molly-card" data-molly-card><img src="{{ '/assets/images/molly-3.jpg' | relative_url }}" alt="Molly looking to the side in warm afternoon light" loading="lazy" width="1200" height="1600"></figure>
      <figure class="molly-card" data-molly-card><img src="{{ '/assets/images/molly-4.jpg' | relative_url }}" alt="Molly wearing a birthday bandana with playful pink whiskers" loading="lazy" width="1424" height="1600"></figure>
      <figure class="molly-card" data-molly-card><img src="{{ '/assets/images/molly-5.jpg' | relative_url }}" alt="Molly sitting on the couch beside a Bulbasaur plush" loading="lazy" width="1200" height="1600"></figure>
      <figure class="molly-card" data-molly-card><img src="{{ '/assets/images/molly-6.jpg' | relative_url }}" alt="Molly smiling while relaxing on the bed" loading="lazy" width="1200" height="1600"></figure>
      <button class="molly-stack__advance" type="button" data-molly-advance aria-label="Show the next Molly photo" aria-describedby="molly-gallery-hint" aria-keyshortcuts="ArrowLeft ArrowRight Home End"></button>
    </div>

    <div class="molly-stack__controls" role="group" aria-label="Molly gallery controls">
      <button class="molly-stack__control" type="button" data-molly-previous aria-label="Show the previous Molly photo">←</button>
      <p class="molly-stack__status" aria-live="polite" aria-atomic="true">
        <span data-molly-current>1</span> / <span data-molly-total>6</span>
      </p>
      <button class="molly-stack__control" type="button" data-molly-next aria-label="Show the next Molly photo">→</button>
    </div>
    <p class="molly-stack__hint" id="molly-gallery-hint">Click the top photo to see the next one.</p>
  </div>
</section>

<script>
  (() => {
    const gallery = document.querySelector('[data-molly-gallery]');
    if (!gallery) return;

    const cards = Array.from(gallery.querySelectorAll('[data-molly-card]'));
    const advanceButton = gallery.querySelector('[data-molly-advance]');
    const previousButton = gallery.querySelector('[data-molly-previous]');
    const nextButton = gallery.querySelector('[data-molly-next]');
    const currentLabel = gallery.querySelector('[data-molly-current]');
    const totalLabel = gallery.querySelector('[data-molly-total]');

    if (
      cards.length < 2 ||
      !advanceButton ||
      !previousButton ||
      !nextButton ||
      !currentLabel ||
      !totalLabel
    ) return;

    let current = 0;
    totalLabel.textContent = String(cards.length);
    gallery.classList.add('is-enhanced');

    const render = () => {
      cards.forEach((card, index) => {
        const distance = (index - current + cards.length) % cards.length;
        card.dataset.position = distance < 3 ? String(distance) : 'hidden';
        card.style.zIndex = String(cards.length - distance);
        card.setAttribute('aria-hidden', distance === 0 ? 'false' : 'true');
      });

      const description = cards[current].querySelector('img').alt;
      currentLabel.textContent = String(current + 1);
      currentLabel.parentElement.setAttribute(
        'aria-label',
        `Photo ${current + 1} of ${cards.length}: ${description}`
      );
      advanceButton.setAttribute(
        'aria-label',
        `Photo ${current + 1} of ${cards.length}: ${description}. Show the next Molly photo.`
      );
    };

    const show = (offset) => {
      current = (current + offset + cards.length) % cards.length;
      render();
    };

    advanceButton.addEventListener('click', () => show(1));
    previousButton.addEventListener('click', () => show(-1));
    nextButton.addEventListener('click', () => show(1));
    advanceButton.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        event.preventDefault();
        show(1);
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        event.preventDefault();
        show(-1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        current = 0;
        render();
      } else if (event.key === 'End') {
        event.preventDefault();
        current = cards.length - 1;
        render();
      }
    });

    render();
  })();
</script>
